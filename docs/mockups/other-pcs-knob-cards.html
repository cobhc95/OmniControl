<html><head><meta charset="utf-8"><title>Other PCs knob cards (approved)</title>
<!-- Approved by the owner 18 Nov 2026. Other PCs mirrored slider cards (PcMirror, SliderItem.AsKnob):
  1 Master knob (Controls/Knob, 32 px face, accent arc) at the card's right; its value under it in the standard typeable field box
    (NumberText look); hover lights ONLY that small box (accent edge, I-beam). One click types, right-click types, double-click resets.
  2 Name is the two-line card label (e.g. "Master" / "volume"); it takes little width.
  3 Device chip (Button.selector / ChoiceChip) between name and knob gets the spare width, wraps to 2 lines, trims only as a last resort.
  4 Brightness card: name "Brightness" + a display chip: menu (shared listmenu) "All displays" (default, ticked), thin line, then
    each display of that PC. All = every screen moves together (knob shows the first one's level); one = that screen only.
    Choice remembered per paired PC. Same chip as Master volume's device chip. -->
