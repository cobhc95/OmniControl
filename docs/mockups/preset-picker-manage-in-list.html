<!doctype html>
<html><head><meta charset="utf-8"><title>Preset picker with Manage in list (approved option B)</title>
<!-- Approved by the owner 15 Nov 2026: option B, to save horizontal space. ONE master preset picker used by every group that has presets
     (Mouse Buttons, Trackpad, Displays Hardware, Displays Software, Volume, any future group). The separate cogwheel button next to it is removed. -->
<style>
body{font-family:Segoe UI,sans-serif;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}
.hd{display:flex;align-items:center;gap:8px;border:1px solid #444;border-radius:8px;padding:6px 10px;background:#232323;max-width:700px}
.sel{border:1px solid #666;border-radius:12px;padding:2px 10px;font-size:12px}       /* Apps scope chip (separate job), sits left of the preset picker */
.dd{border:1px solid #888;border-radius:4px;padding:3px 10px;min-width:130px;display:flex;justify-content:space-between} /* the master preset drop-down, no cog beside it */
.menu{width:220px;margin:4px 0 0 470px;border:1px solid #666;border-radius:8px;background:#262626;padding:6px;font-size:12px}
.mr{padding:5px 8px;border-radius:5px}.mr.on{outline:1px solid #E8833A}.hr{border-top:1px solid #444;margin:5px 0}
</style></head><body>
<div class="hd"><span>▾</span><b>Mouse Buttons</b><span class="sel" style="margin-left:auto">Apps: all ▾</span><span class="dd">Laptop <span>▾</span></span></div>
<!-- Open list: the presets (current one marked), a thin line (Border.hrule), then "⚙ Manage presets…" as the last row, which opens the preset manager
     at this group (what the cog did). Choosing a preset applies it live; choosing Manage does not change the selection. Keyboard: Manage is reachable as the last item. -->
<div class="menu"><div class="mr on">Laptop</div><div class="mr">Layer 2</div><div class="mr">Gaming</div><div class="hr"></div><div class="mr">⚙ Manage presets…</div></div>
</body></html>
