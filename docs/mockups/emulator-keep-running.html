<!doctype html>
<html><head><meta charset="utf-8"><title>Emulator keep-running settings (approved)</title>
<!-- Approved by the owner 16 Nov 2026. Smart Devices > Simulation: one row "Emulator" with a Keep running chip (ChipMenu + listmenu), a state tag
     (running/stopped, hidden/shown, memory used), and pills Show / Close now. Menu: Always | Until idle N min (default 30, number typed per NumberText) |
     Close after each action; hrule; toggles Start with Windows, Show the emulator window. Values live in the settings class; idle default in Timing.cs.
     Behaviour: first action wakes the emulator hidden (-no-window unless Show is on) with quick boot (snapshot) after one good cold boot; a broken snapshot
     falls back to cold boot once. Close now = clean shutdown (adb emu kill) so the snapshot is saved. -->
<style>body{font-family:Segoe UI,sans-serif;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}
.c{border:1px solid #666;border-radius:11px;padding:1px 9px}.t{font-size:11px;border:1px solid #4a4;color:#6c6;border-radius:8px;padding:0 6px}
.m{margin:8px 0 0 70px;width:300px;border:1px solid #666;border-radius:8px;padding:6px;background:#262626;font-size:12px}.mu{color:#999;font-size:11px}.r{padding:4px 6px}</style></head><body>
<div style="display:flex;gap:8px;align-items:center;border:1px solid #444;border-radius:8px;padding:10px;max-width:620px"><span>Emulator</span><span class="c">Keep running: until idle 30 min ▾</span><span class="t">running · hidden · 1.9 GB</span><span class="c" style="margin-left:auto">Show</span><span class="c">Close now</span></div>
<div class="m"><div class="mu r">Keep running</div><div class="r">Always <span class="mu">· fastest, uses memory all the time</span></div><div class="r">✓ Until idle 30 min</div><div class="r">Close after each action <span class="mu">· frees memory, ~15 s per action</span></div><div style="border-top:1px solid #444;margin:4px 0"></div><div class="r">☐ Start with Windows</div><div class="r">☐ Show the emulator window</div></div>
</body></html>
