<!doctype html>
<html><head><meta charset="utf-8"><title>Area video recording (approved)</title>
<!-- Approved by the owner 16 Nov 2026. Extends screenshot-tool.html and screenshot-toolbars-a.html.
  1 Action bar: a red "Record" button (record glyph, BrushDanger-ish red from the theme) right after Save, in the Copy/Save group. Tooltip "Record video".
  2 Recording: the dim, handles and drawing tool bar disappear; the screen stays usable (overlay becomes click-through except the bar); the selection gets a
    2 px dashed red frame; under it a small bar (same panel style): red dot + timer mm:ss (tabular), separator, Pause/Resume, Stop (red), separator,
    Microphone toggle, System sound toggle. Frame and bar are excluded from capture (SetWindowDisplayAffinity WDA_EXCLUDEFROMCAPTURE).
    Stop: the Stop button, Esc, or the action's hotkey again. Result saved to the folder (+ OSD note "Saved <file>", optional open folder); drawings are not recorded.
    Output resolution = the selection in physical pixels (even width/height for H.264). Max length/size guard in Timing/limits.
  3 Settings (action window, Screenshot section, a "Video" group on the area action and on the new action "Record area" which asks for the area and records
    at once): Format MP4 (H.264) | MP4 (HEVC, disabled with reason when the HEVC extension is missing) | GIF; Frame rate 15/24/30/60; Encoder Auto (graphics
    card) | Software; Quality Low/Medium/High (bitrate derived from size x fps); Audio: System sound, Microphone; Pointer: Show cursor, Highlight clicks;
    Save folder (PathField, default Videos\OmniControl); file name uses the screenshot pattern.
  Engine: Windows.Graphics.Capture (or Desktop Duplication) + Media Foundation Sink Writer for MP4 (hardware MFT when available); WASAPI loopback + mic mixed;
  GIF encoded in-app (palette per frame, lightweight). No FFmpeg, nothing extra bundled. All capture/encode code in Core. Release every COM object. -->
<style>body{font-family:Segoe UI;background:#2b2f36;color:#eee;padding:20px}</style></head><body>
<div style="width:300px;height:140px;border:2px dashed #e5484d"></div>
<div style="margin-top:6px;display:inline-block;background:#232323;border:1px solid #3a3a3a;border-radius:10px;padding:6px 10px">● 00:12 | pause · stop | mic · sound</div>
</body></html>
