<title>Mixer rows: device selector, method chip, knobs, Mute, glowing FX; Sound setup button (approved 2026-11-15)</title>
<!--
APPROVED MOCK-UP + SPEC for the Volume page, Mixer tab (this deliberately CHANGES the Advanced view; the earlier 'no changes to Advanced' rule applied to the Easy mode jobs only; the owner now asked for this change).
1. SOUND SETUP BUTTON: the 'Sound mode: Fast/Full control (N)' button at the right of the tab row (both tabs, same place) becomes 'Sound setup (N) v' (N = the live setup number badge). Clicking it opens the 'Sound setups' table window directly (the Help table: Master runs on | The cable is used for | Programs with effects | Master effects | Works) where the live row is highlighted and CLICKING AN AVAILABLE ROW APPLIES THAT SETUP in one step (greyed rows show their reason); the window's footer holds the buttons that used to be in the Sound mode panel: 'Get Equalizer APO', 'Get a virtual cable' / 'More cables', 'Choose devices', 'Remove VB-CABLE'. The Fast / Full control option cards and the words 'Sound mode: Fast/Full control' disappear from the interface (the words may stay in the table's group headings); the engine still has its two internal modes, nothing asks the user to choose between them. Rename the hotkey/search entry 'Switch sound mode' to 'Next sound setup' (cycles the setups that work); old settings map: Fast -> setup 8, Full control -> setup 1 (never lose the stored mode).
2. EVERY MIXER ROW (master, programs, closed programs dimmed): columns [icon] [name + state word 'playing' / 'not open' (small, muted)] [PLAYS ON selector] [METHOD selector with a short fact line under it] [PAN knob] [VOLUME knob] [M mute] [FX button]; small column headings above the rows (Plays on, Method, Pan, Volume, Mute, FX). The old text line '-> Master . 1 effect . Method ...' and the status clutter move into: the fact line under the method chip (short, from SoundModes status wording: '8 ms', '70 ms', 'no delay', 'on the speakers', 'Starts when it plays'...), tooltips, and the glowing FX button. Name and the two selector columns share the spare width (ellipsis); knobs, M and FX keep fixed sizes so nothing is squeezed at the narrowest window.
   - PLAYS ON selector: a chip with a small down arrow, shaped exactly like the Method chip (Border/Button with a chevron): shows the device ('Speaker (Realtek)', or 'Master' for a program that follows the master); opens the existing Plays on pop-down list (devices, current marked, '+ Add a second device' where several are allowed, combined devices, honesty rules (greyed with reasons)). Reuse the existing Wiring tab 'Plays on' logic (do not duplicate): the Mixer's Plays on stops being read-only text.
   - METHOD selector: the real method in use as a coloured chip with arrow: Equalizer APO (green), Cable (blue), Recording (orange), Direct (grey; also 'Cable bus' for the master / for programs passing through it, in blue); opens the existing Method menu (Automatic, Cable, Recording...; greyed with reasons). Shown on EVERY row, also programs without effects ('Direct') and microphones (Equalizer APO on the mic device / Cable). Colours from theme brushes (BrushTag good = green, accent = recording orange, a blue brush for cables (add one master brush if none), muted for direct).
   - KNOBS: ONE shared control `Knob` (Controls/): 32 px, 270 degree sweep (start at lower left, end at lower right), a grey track arc, an accent value arc and a pointer line; PAN: arc drawn from the centre mark to the value (left or right), value text under it ('C', 'L 20', 'R 20'); VOLUME: arc from empty to the value, value text under it (0-100). Interaction: drag up/down turns it (or circular drag), mouse wheel over it changes by the usual step (ValueWheel rules), arrow keys when focused (Up/Right increase, Down/Left decrease, Shift/PageUp/PageDown large, Home resets), DOUBLE-CLICK resets (volume 100, pan centre: SliderReset.Value pattern), a single LEFT CLICK (without a drag) opens a small text box over the knob with the value selected for exact typing (Enter or clicking away applies, Esc cancels; NumberText rules: this is the owner's explicit rule for these knobs: left click types, double-click resets; document the difference from other controls in HANDOVER and AGENTS.md); symmetrical, same size everywhere, uses master brushes (no literal colours), focus ring = accent per the app's focus rule, a tooltip with the exact value. Bind to the same view-model properties the sliders used (Volume, Pan) so the engine/OSD/hotkeys/meters keep working; keep the level meters (they are drawn beside the volume in the old row: keep them visible in the row if space allows: as a thin meter under or beside the volume knob; if not, in the knob's tooltip: state the choice).
   - M: the existing mute button. FX: the existing FX button, but with the GLOW: when the row has effects ON (FxOn and at least one enabled slot) it takes the accent look plus a soft glow (accent border, accent text, accent soft background, a soft accent shadow via a master style `Button.pill.glow`/`.fxon`); pressing it TOGGLES the FX window for that row (opens it; pressing again closes it); with no effects it is plain and pressing it opens the window to add some.
3. Master styles only; sizes in App.axaml resources; every new file in ARCHITECTURE.md; AGENTS.md master list gets the Knob and the new classes.
Colours below are placeholders for theme brushes.
-->
<style>
body{font:13px sans-serif;background:#1e1e1e;color:#ddd;margin:16px}
.grp{max-width:760px;border:1px solid #444;border-radius:12px;background:#262626;padding:8px}
.row,.cols{display:grid;grid-template-columns:24px minmax(70px,1fr) minmax(96px,1.1fr) minmax(96px,1.1fr) 34px 34px 26px 34px;gap:6px;align-items:center}
.row{border:1px solid #3a3a3a;border-radius:10px;padding:6px;margin:0 0 5px;background:#1f1f1f}
.cols{font-size:10px;color:#888;padding:0 6px 3px}
.sel,.mt{border:1px solid #555;border-radius:11px;padding:2px 8px;font-size:11px;display:flex;justify-content:space-between}
.mt.apo{border-color:#639922;color:#7bbf5a}.mt.cab{border-color:#378ADD;color:#5aa0e6}.mt.rec{border-color:#E8873A;color:#E8873A}
.fx{border:1px solid #555;border-radius:12px;text-align:center;padding:3px 0;font-size:11px}.fx.on{border-color:#E8873A;color:#E8873A;box-shadow:0 0 8px 1px rgba(232,135,58,.55)}
.mute{border:1px solid #555;border-radius:8px;text-align:center;padding:3px 0}
</style>
