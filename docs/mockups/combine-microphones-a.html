<!doctype html>

<title>Combine microphones, option A (approved 2026-11-14)</title>
<!--
APPROVED MOCK-UP for the Volume page > Wiring tab > Microphones group (full design and wording rules: docs/design-combine-microphones.md, option A + shared fixes S1-S6).
Regions:
 1. Group header: "Microphones  N devices" at the left, a "+ Combine microphones" pill (accent outline = Button.pill.cardaction.main style) at the right.
    The pill opens the existing Combine devices window already set to Microphones (it is kept for naming and ticking).
 2. Real microphone rows (as today): Source | Records from | Cable. The Records from cell shows "This microphone" and a dashed "Combine with..." chip
    (Button.blockadd.small) that opens a menu (Button.menurow, FlyoutPresenter.listmenu) listing the other microphones and existing combined microphones;
    picking one creates or extends a combined microphone.
 3. Combined microphone row (accent-edged row): name, a tag "Combined" (Border.tag), the members as removable chips (Button.chipx) + a dashed "+ add" chip;
    clicking a chip opens a small pop-down with that member's level slider (Slider.compact) and mute; the x removes it. Cable cell = status tag:
    "Ready: apps record CABLE Output" (good) / "Needs a free virtual cable" + links (More cables | Switch to Fast) (caution) / "Full control: the master bus uses the cable".
 4. Combined microphones show here ONLY (not as cards in the Combined devices group; that group keeps speakers).
All wording calm, one sentence, details in tooltips (principle 11). Colours below are placeholders for theme brushes.
-->
