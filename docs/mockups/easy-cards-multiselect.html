<title>Easy goal cards: multi-select with requirements box (approved 2026-11-14)</title>
<!--
APPROVED MOCK-UP + SPEC (owner: "user should be able to select multiple cards then press next to move to the next step in setup. Also somewhere down it should say the requirement depends on what they press (e.g. 2 virtual audio device cables, or EQ APO + Virtual cable etc.)", and: "delete the 6th card 'Just the volume' because the user can always just press skip setup").
Welcome screen (first launch and 'Set up again'): title row 'Volume' + 'Easy | Advanced'; 'What do you want to do?' + muted hint 'Pick as many as you like.'; FIVE goal cards in a 3 x 2 grid (the 6th card 'Just the volume' is REMOVED from the goals list; remove it from EasyGoals and every place that counts six cards):
  1 Make everything sound better, 2 A different sound per app, 3 Improve my microphone, 4 Join two microphones, 5 Play on two speakers.
Each card: title, tiny flow picture, one fact line, a TICK BOX at its top-right corner (rounded 5 px square, ticked = accent fill with a check). A selected card has the accent 1.5 px border and the accent tint background. Clicking anywhere on a card toggles it. '✓ on' marks for goals already set up stay.
Under the cards a 'What you will need' box (rounded card, header 'What you will need', one line per requirement: a small round state dot (✓ good / ! caution), the requirement text, an optional muted qualifier, the live count/state on the right (e.g. '0 installed') and a Get button where something can be installed). It follows the selection and is computed by ONE pure function from the selected goals + the live facts (EasyFacts):
  - nothing selected: the box says 'Pick a goal to see what it needs.' and Next is off;
  - goals 1, 2, 3 only: 'Equalizer APO, or a virtual cable' (qualifier 'you choose on the next step'), plus a line for the state of Equalizer APO (installed / not installed + Get button), no cable needed when all selected goals allow Equalizer APO (programs are recorded);
  - goal 4 (join mics) and/or goal 5 (two speakers) selected: 'N virtual cables' where N = number of cable-needing goals selected (4 needs one pair, 5 needs one pair; 4 + 5 = 2 pairs; qualifier explains 'one to join the microphones, one for the speakers'), the live installed/allowed count and a 'Get virtual cables' button (the existing More cables / VB-Audio page / Install VB-CABLE action); 'Equalizer APO is not needed' line when no selected goal wants it; 'Full control mode' line (qualifier 'the app asks before switching') because cable goals need Full control;
  - mixed (for example 1 + 4): both lines: 'Equalizer APO' (for goal 1) AND 'a virtual cable' (for goal 4) with their states; note that the master then runs on Equalizer APO while a cable is used for the joined microphone (setup 3 in the Help table) when the master method allows it, else the cable bus;
  - with fewer cables installed than needed: show '!' with the shortage and the note 'With your N cable(s) you can do some of these now. Next stays on; the setup runs them in order and stops with a clear message where a cable is missing.'
Bottom row: left link 'Skip, just show my volume' (goes to the Easy page, same as before: this replaces the 'Just the volume' card), right 'Next' (off until at least one goal is ticked). Next starts the guided setups for the selected goals ONE AFTER ANOTHER in the order of the cards (progress strip shows the goal name and 'Goal 2 of 3'); the engine step appears once per goal that allows a choice (a later goal reuses the engine already chosen when compatible); Done ends on the Easy page with a summary of what was set up.
All wording calm and short; colours are placeholders for theme brushes.
-->
<style>
body{font:13px sans-serif;background:#1e1e1e;color:#ddd;margin:16px}
.win{max-width:720px;background:#262626;border-radius:14px;padding:14px 16px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{border:1px solid #555;border-radius:11px;background:#303030;padding:8px 10px;position:relative}.c.sel{border:2px solid #E8873A}
.ck{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:5px;border:1px solid #666;text-align:center;font-size:11px}.sel .ck{background:#E8873A;color:#fff}
.need{border:1px solid #555;border-radius:12px;background:#303030;padding:10px 12px;margin-top:10px}
</style>
<div class="win"><p><b>What do you want to do?</b> <span style="color:#888">Pick as many as you like.</span></p>
<div class="cards"><div class="c sel"><span class="ck">✓</span><b>Make everything sound better</b></div><div class="c"><span class="ck"></span><b>A different sound per app</b></div><div class="c"><span class="ck"></span><b>Improve my microphone</b></div><div class="c"><span class="ck"></span><b>Join two microphones</b></div><div class="c"><span class="ck"></span><b>Play on two speakers</b></div></div>
<div class="need"><b>What you will need</b><br>✓ Equalizer APO, or a virtual cable (you choose on the next step)</div>
