<!-- Approved by the owner 18 Nov 2026. The groups of a PC tab (PcMirror) never move on refresh/reconnect/state change.

  LEFT "what you see and hear": Screens, Sound, Now playing. RIGHT "the PC and the room": Power, Smart devices.
  A group with nothing (offline, empty, not shared) keeps its place and shows a muted "Not available" body instead of disappearing.
  Narrow window (below the two-column width): one column in the order Screens, Sound, Now playing, Power, Smart devices.
  Cards inside a group keep a stable order too (by the entry's registration order/id, never by arrival order). -->
