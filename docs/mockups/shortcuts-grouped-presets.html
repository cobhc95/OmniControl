<!doctype html>
<html><head><meta charset="utf-8"><title>Shortcuts page grouped, with presets (approved)</title>
<!-- Approved by the owner 15 Nov 2026. Colours from the app theme; sizes are guides. -->
<style>
body{font-family:Segoe UI,sans-serif;background:#1b1b1b;color:#eee;padding:20px;font-size:13px;max-width:760px}
.top{display:flex;align-items:center;gap:8px}
.pill{border:1px solid #666;border-radius:12px;padding:2px 10px;font-size:12px}                  /* Button.pill */
.dd{border:1px solid #888;border-radius:4px;padding:3px 10px;min-width:120px}                    /* Controls/PresetPicker (Manage presets… is its last row) */
.g{border:1px solid #444;border-radius:10px;padding:6px 10px;margin:6px 0;background:#202020}   /* main group = one per sidebar page, in sidebar order (Border.groupPanel / CardGroup) */
.sg{border:1px solid #444;border-radius:8px;padding:5px 10px;margin:5px 0 0 14px;background:#262626;display:flex;gap:8px} /* sub-group card, folds, like Displays > Built-in display */
.row{display:flex;margin:4px 0 0 28px;font-size:12px}                                            /* shortcut row (existing HotkeyBox) */
.mu{color:#999;font-size:12px}
</style></head><body>
<!-- Title line: page title; right: ONE preset picker for the whole program's shortcut set, "Clear all" pill (asks once: removes every key in the current set), "Restore defaults" pill. -->
<div class="top"><span style="font-size:20px;font-weight:600">Shortcuts</span><span class="dd" style="margin-left:auto">Default set ▾</span><span class="pill">Clear all</span><span class="pill">Restore defaults</span></div>
<!-- Main groups: Displays, Volume, OSD, Mouse and Trackpad, Gestures, Automation, App settings, ... (from the live page list, merged: no duplicate "Displays").
     Header right: "N shortcuts · M set". Sub-groups (from HotkeyAction.Group/Subgroup on the master entries) fold inside. "Use suggested keys" stays on the sub-group that has suggestions. -->
<div class="g"><div><b>▾ Displays</b> <span class="mu" style="float:right">93 shortcuts · 4 set</span></div>
<div class="sg">▾ Hardware<span class="mu" style="margin-left:auto">68</span><span class="pill">Use suggested keys</span></div>
<div class="row">Rotate to Landscape<span style="margin-left:auto">Ctrl + Alt + ↑</span></div>
<div class="row">Brightness up<span class="mu" style="margin-left:auto">not set</span></div>
<div class="sg">▸ Software<span class="mu" style="margin-left:auto">25</span></div></div>
<div class="g"><b>▸ Volume</b> <span class="mu" style="float:right">15 shortcuts</span></div>
<div class="g"><b>▾ Automation</b> <span class="mu" style="float:right">12 shortcuts</span>
<div class="sg">▸ Power<span class="mu" style="margin-left:auto">6</span></div><div class="sg">▸ Power mode<span class="mu" style="margin-left:auto">3</span></div><div class="sg">▸ Rules and custom actions<span class="mu" style="margin-left:auto">3</span></div></div>
</body></html>
