<!doctype html>
<html><head><meta charset="utf-8"><title>Tray tile states (approved v2)</title>
<!-- Approved by the owner 17 Nov 2026. A tile ALWAYS shows the device's real/last-read state (on = accent wash, off = plain); it never lights up just
     because it was clicked. A small mark (11 px) at the tile's top-right shows activity:
       running an action: small spinning ring (grey track, accent arc) until the device confirms; then the tile changes to the confirmed state.
       reading state: small pulsing grey dot.
       not sure (not read recently, or simulation-only): tile faded (~55%) + small clock glyph; the reason ("Last read 08:39" / "Simulation only:
         press Check now") is shown ONLY for this case, on hover.
       failed (action or read): small red warning glyph; tile keeps its previous state; the reason is in the tile's right-click menu as a muted line.
  RE-READ ON OPEN: opening the tray panel re-reads device states through Scripts only, staggered (one device at a time, after the panel has drawn,
     small gap between, Timing.cs) so opening stays instant. A setting in Smart Devices' Auto-check menu: "Also when the tray panel opens" (on by default,
     follows "Same for every device"). Simulation is never used for these reads.
  Any state read anywhere (Check now by Simulation, the page, auto-checks) updates the tile live via the StateRegistry; nothing tray-specific.
  Marks use the icon library glyphs and shared styles (Styles/Tray.axaml). -->
<style>body{font-family:Segoe UI;background:#1b1b1b;color:#eee;padding:20px;font-size:12px}</style></head><body>
<p>Off (read) · Clicked: spinner, still off · Confirmed on: lit · Reading: pulsing dot · Not sure: faded + clock · Failed: red warning, unchanged</p>
</body></html>
