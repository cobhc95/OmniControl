<title>Unified preset manager (approved 2026-11-14)</title>
<!--
APPROVED MOCK-UP + SPEC. Owner: "unify all the presets windows in the program: they all should open ONE preset manager window which has sub-sections (2 panes similar to the original program) and each section has sub-cards where the user can see and manage all presets (move by drag and drop, rename, delete, add, and assign a hotkey to activate certain presets); all the preset cogwheel settings open that shared window, and depending on where it was opened from the focus/scroll is on that section." And: "the pane on the left should have the original program sections (Displays, Volume, etc.) and the sub-cards named like the groups in those sections (only the ones that have presets control), e.g. Mouse Buttons and Trackpad".
WINDOW: title 'Presets', Close button; two panes. LEFT pane = the app's own sidebar sections in the same order, with their icons: Displays, Volume, OSD, Mouse and Trackpad, Gestures, Shortcuts; a section with no presets is dimmed with 'none' (not selectable or selectable but empty: choose not selectable), others show a small count ('2 groups', 'effects'). RIGHT pane = the selected section: a search box ('Search presets and shortcuts...'), the section title, then ONE CARD PER GROUP THAT HAS PRESETS, named exactly like that group in the page (Mouse and Trackpad -> 'Mouse Buttons' (layers) and 'Trackpad' (layers); Displays -> 'Hardware' (monitor presets, per monitor) and 'Software' (picture presets); Volume -> a card per effect kind that has presets (Equaliser Parametric, Graphic 32, Graphic 16, Compressor...), from the Fx preset catalog).
EACH PRESET = a row: drag handle (reorder by drag and drop within the card; the dragged row is outlined), name (+ an 'in use' tag where it is the live one; Hardware presets show tags per monitor name, 'not connected' for absent ones), a SHORTCUT chip ('+ shortcut' dashed when none, the key text when set; clicking it captures a hotkey through the existing hotkey capture box and registers a global OmniControl action 'Apply preset <name>' in the master list, searchable and listed on the Shortcuts page; conflicts are refused with the existing reason text; the shortcut applies that preset from anywhere: for mouse/trackpad layers it switches to that layer), and actions: rename, delete (built-in presets: shortcut allowed, no rename/delete; layers: 'clear' instead of delete for the first three), Duplicate where it exists today. At the bottom of each card: '+ Add a preset' / '+ Save current ... as a preset' (what is saved depends on the group). Footer: 'Changes apply at once.' (principle 2: no Apply step). Undo for delete (the Fx manager's undo line).
OPENING: every preset cogwheel / 'Manage presets...' entry opens THIS window through ONE service (PresetManagerService.Open(sectionId, groupId?)): Mouse Buttons header cogwheel -> Mouse and Trackpad / Mouse Buttons card; Trackpad header -> Mouse and Trackpad / Trackpad; Displays Software header -> Displays / Software; Displays Hardware header -> Displays / Hardware; FX window preset box 'Manage presets...' -> Volume / that effect's card; App settings has a 'Presets' card that opens it at the top. The target section is selected in the left pane and the target card is scrolled into view and outlined (accent border). The window is non-modal, reused if already open (it just navigates). The old separate windows (layer manager, display presets window, monitor presets window, Fx preset manager window) are REMOVED after their features are moved (keep every feature: rename/delete/duplicate/import/export/undo/reserved names/starred user presets).
DATA: each group registers itself ONCE in a master list of preset groups (id, section, title, provider with: list, reorder, rename, delete, add/save current, apply, hotkey support, built-in flag), so the manager has no per-group code and new groups appear by registration (master-list rule). Persist order and shortcuts in the existing stores with backward compatibility.
Colours/sizes below are placeholders for theme brushes and master styles.
-->
<style>
body{font:13px sans-serif;background:#1e1e1e;color:#ddd;margin:16px}
.win{max-width:800px;background:#262626;border:1px solid #555;border-radius:14px;overflow:hidden}
.bar{display:flex;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #3a3a3a;font-weight:600}
.body{display:grid;grid-template-columns:190px 1fr}.nav{border-right:1px solid #3a3a3a;padding:10px 8px;background:#2b2b2b}
.ni{padding:6px 9px;border-radius:9px;margin:2px 0;border:1px solid transparent}.ni.sel{border-color:#E8873A;color:#E8873A}.ni.dim{opacity:.4}
.main{padding:12px 14px}.card{border:1px solid #555;border-radius:12px;background:#303030;padding:8px 10px;margin:0 0 10px}.card.focus{border:2px solid #E8873A}
.row{display:flex;gap:8px;border:1px solid #3a3a3a;border-radius:9px;padding:5px 8px;margin:0 0 4px;background:#262626}.nm{flex:1}.hk{border:1px dashed #666;border-radius:8px;padding:0 8px;color:#aaa}
</style>
<div class="win"><div class="bar"><span>Presets</span><span>Close</span></div><div class="body"><div class="nav"><div class="ni">Displays</div><div class="ni">Volume</div><div class="ni dim">OSD</div><div class="ni sel">Mouse and Trackpad</div><div class="ni dim">Gestures</div><div class="ni dim">Shortcuts</div></div>
