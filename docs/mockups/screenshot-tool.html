<html><head><meta charset="utf-8"><title>Screenshot actions and area capture (approved)</title>
<!-- Approved by the owner 16 Nov 2026 for 0.1.2. Works like Lightshot but with OmniControl's own look and drawn icons (no copying of Lightshot's art or branding).
  1 ACTIONS (master list HotkeyRegistry, PickerSection "Screenshot" after Launch in the Choose-the-action window, own glyph):
    Screenshot: area (edit) | Screenshot: active window | Screenshot: full screen (screen under the pointer) | Screenshot: all screens.
    Settings pane (live, shared by all four via the "apply to all" switch on by default, principle 5): Save folder (PathField Folder, default Pictures\Screenshots);
    File name pattern ({date} {time} {app}); Format PNG/JPG/WebP/BMP (ChoiceChips); Quality slider (JPG/WebP only, SliderField, default 90);
    Copy as Image | Image + file path; After saving: Open folder, Show OSD note. Non-area actions: capture -> copy and/or save per settings, no editor.
  2 AREA CAPTURE OVERLAY (one borderless top-most window per monitor, per-monitor DPI):
    screen frozen and dimmed; drag to select; selection stays bright, has 8 resize handles, drag inside to move, size label "W × H" above its top-left;
    arrow keys nudge (Shift = 10 px). Right of the selection a vertical drawing toolbar: Pen, Line, Arrow, Rectangle, Marker (translucent), Text, Blur/pixelate,
    Colour (swatch -> palette pop-down), Undo (Ctrl+Z; Ctrl+Y redo). Under the selection an action bar: Search image online, Print, Copy (Ctrl+C), Save (Ctrl+S),
    Close (Esc). Toolbars flip to the other side/above when there is no room. Drawings are vector objects until export.
    Search image online: copies the image and opens Google Lens (lens.google.com) in the default browser with a one-line OSD "Image copied, paste it into Lens";
    never uploads by itself. Print: Windows print dialog.
  Added by the owner 16 Nov 2026:
    Read QR code: a button in the action bar (drawn QR glyph) decodes the QR codes in the selection on this PC (ZXing.Net, Apache-2.0, credited in NOTICE.txt);
    one code = a pop-down with its text, "Copy" and, for an http/https address only, "Open in browser" (WebPage.Open); several = one row per code;
    none = the plain line "No QR code found.". Decoding in Core.
    Drawing is clipped to the selection: nothing drawn shows or exports outside it; moving or resizing the selection leaves the drawings in place
    (parts outside are hidden, not lost). Each stroke or shape is one undo step: Ctrl+Z, Ctrl+Y or Ctrl+Shift+Z, and the Undo button. Ctrl+P prints.
    Stay on top setting (area action): Normal = a top-most window; Strong = the screen is frozen first, the overlay is a top-most tool window that
    puts itself back on top and takes the foreground back on a short interval. Elevated windows (Task Manager as administrator) stay above it (Windows UIPI).
    No social-media share and no cloud upload, now or later.
  Layers: capture, clipboard, print, DPI in Core; overlay/editor view + VM in App (Screenshot/ folder); timings in Timing.cs; settings class in DataStore (backed up). -->
