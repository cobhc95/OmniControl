<!doctype html>
<html><head><meta charset="utf-8"><title>OSD duration and per-app/event exceptions (approved)</title>
<!-- Approved by the owner 18 Nov 2026.
  1 OSD page, Customize OSD group: a new HALF card "Duration" beside Opacity: Slider (shared slider card, typeable value box via NumberText, unit "s",
    one decimal, range and default in settings/Timing, e.g. 0.5-10 s, default = today's current OSD time so nothing changes until edited) and the
    master Button.pill.cog (tooltip "Duration per app or event…") opening the window below.
  2 Window "OSD duration" (shared dialog window, SingleWindow, Classes="dialog"): row "Everything else" (bold) with its typeable seconds box = the
    same value as the Duration card (one setting, two views). Muted small-caps heading "EXCEPTIONS · first match wins". Each exception row:
    grip (drag reorder via the shared ListDragReorder), a chip picker (Controls/ChipMenu + listmenu) choosing "App: <program>" (from the app lists /
    ProgramIdentity, the program that caused the OSD, e.g. Spotify, Microsoft Edge) or "Event: <OSD element>" (the OsdElement master list: volume,
    brightness, microphone, media, smart devices…), a typeable seconds box, and the master remove cross. Below: Button.blockadd.small "+ add exception".
    Foot: Close only (Button.primary.close). Live: every change applies at once, no Apply.
  3 Resolution: when an OSD shows, the first matching exception (in list order) gives the time, else "Everything else". Stored in the OSD settings;
    one resolver in Osd/ (pure, testable). Search finds "OSD duration". -->
<style>body{font-family:Segoe UI;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}</style></head><body>
<p>[Opacity ——●— 90] [Duration ——●— 2.0 s ⚙]</p>
<p>OSD duration · Everything else [2.0 s] · EXCEPTIONS: ⋮ [App: Spotify ▾] [5.0 s] ✕ · ⋮ [App: Microsoft Edge ▾] [3.0 s] ✕ · ⋮ [Event: Smart devices ▾] [4.0 s] ✕ · [+ add exception] · [Close]</p>
</body></html>
