<!doctype html>
<meta charset="utf-8">
<title>EQ - Parametric: Design C (approved 2026-11-14)</title>
<!--
APPROVED MOCK-UP for the "Equaliser - Parametric" editor (Fx/EqPanelRow.axaml, EqBandRow.axaml, EqGraph.cs).
Layout, left to right:
  1. BAND LIST (96-104 px wide, same height as the graph): one row per band. Row = colour dot (same colour as the band's circle on the
     graph) + band number + frequency right-aligned. Selected row: raised background, 3 px accent bar on its left edge. Bypassed band:
     dimmed row with struck-through text, and a dashed hollow circle on the graph. Dashed "+ Add" row pinned UNDER the list.
     Row sizing: rows share the list height equally; minimum row height 18 px; below that the list scrolls with the standard
     OmniControl scroll bar (Styles/ScrollBars.axaml) placed beside the list; selecting a band (row or circle) scrolls it into view.
  2. GRAPH (fills the width): band circles (9 px radius, 6 px when more than 10 bands). DOUBLE-CLICK a circle toggles that band on/off.
     Single click selects; drag moves frequency/gain as today.
  3. VERTICAL SLIDER (column right of the graph, full graph height): the OVERALL gain of the whole equaliser (the same value as the old
     "Overall gain" card, which is removed from under the editor), not a band's gain. Value readout under it, wide enough to never truncate.
     (CHANGED 2026-11-14 after approval: originally it showed the selected band's gain.)
  Under the graph: the selected band's Type, On, then THREE slider rows: Frequency (Hz and note), Bandwidth (octaves and Q) and GAIN
  (the selected band's gain, horizontal, same thick slider style, greyed for types without gain). The mock-up blocks below still draw the
  older panel; follow this comment where they differ.
Everything uses master styles; the colours below are placeholders for the theme brushes.
-->
<style>
body{font:13px sans-serif;background:#1e1e1e;color:#ddd;margin:16px}
.d{background:#262626;border-radius:12px;padding:12px;margin:0 0 12px;max-width:760px}
.h{color:#aaa;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:stretch}
.list{width:104px;height:222px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.scroll{overflow:hidden;display:flex;flex-direction:column;gap:3px;flex:1}
.it{border:1px solid #3a3a3a;border-radius:8px;padding:0 8px;color:#aaa;display:flex;gap:6px;align-items:center;flex:1 1 0;min-height:0;white-space:nowrap}
.it.on{background:#303030;color:#fff;border-color:#555;box-shadow:inset 3px 0 0 #E8873A}
.it.off{opacity:.45;text-decoration:line-through}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.it small{color:#888;margin-left:auto}
.sb{width:8px;background:#303030;border-radius:4px;position:relative;flex:none}
.sb div{position:absolute;left:0;right:0;border-radius:4px;background:#666}
.g{flex:1;min-width:0;background:#303030;border:1px solid #3a3a3a;border-radius:8px;height:222px}
.vs{width:40px;display:flex;flex-direction:column;align-items:center;color:#aaa;gap:2px}
.tr{flex:1;width:4px;background:#555;border-radius:2px;position:relative}
.th{position:absolute;left:-6px;top:44%;width:16px;height:16px;border-radius:50%;background:#E8873A}
.add{border:1px dashed #555;border-radius:8px;padding:3px 8px;color:#aaa;text-align:center;margin-top:3px}
.panel{background:#303030;border:1px solid #555;border-radius:8px;padding:8px 10px;display:flex;gap:14px;margin-top:8px}
.f{display:flex;flex-direction:column;gap:2px}.f span{color:#888;font-size:11px}
.f i{font-style:normal;border:1px solid #555;border-radius:6px;padding:3px 8px;min-width:64px}
</style>
<div id="r"></div>
<script>
var cols=['#E8873A','#4FA3D9','#6BBF7A','#C77DD6','#D9B84F','#E06C75'];
function g(n){var s='<svg viewBox="0 0 520 222" width="100%" height="222" style="display:block">';
for(var i=1;i<5;i++)s+='<line x1="0" x2="520" y1="'+(44*i)+'" y2="'+(44*i)+'" stroke="#3a3a3a"/>';
s+='<path d="M0 125 C80 130 150 90 230 85 S380 120 450 100 S500 100 520 96" fill="none" stroke="#E8873A" stroke-width="2"/>';
var shown=Math.min(n,12);for(var i=0;i<shown;i++){var x=30+i*(460/Math.max(shown-1,1)),y=110+Math.sin(i*1.7)*34;
s+='<circle cx="'+x+'" cy="'+y+'" r="'+(n>10?6:9)+'" fill="'+(i%5==3?'none':cols[i%6])+'" stroke="'+cols[i%6]+'" stroke-width="2" '+(i%5==3?'stroke-dasharray="3 2"':'')+'/>';}
return s+'</svg>';}
function items(vis,h){var o='';for(var i=0;i<vis;i++){o+='<div class="it'+(i==1?' on':'')+(i%5==3?' off':'')+'" style="'+(h?'max-height:'+h+'px':'')+'"><span class="dot" style="background:'+cols[i%6]+'"></span>'+(i+1)+'<small>'+['80','400','1k','2.5k','4k','6k','9k','12k'][i%8]+'</small></div>';}return o;}
function block(t,n,vis,h,sb){return '<div class="d"><p class="h">'+t+'</p><div class="row"><div><div class="list"><div class="scroll">'+items(vis,h)+'</div></div><div class="add">+ Add band</div></div>'+(sb?'<div class="sb"><div style="top:0;height:'+sb+'%"></div></div>':'')+'<div class="g">'+g(n)+'</div><div class="vs"><span>+24</span><div class="tr"><div class="th"></div></div><span>-24</span><span style="color:#fff">+3.5 dB</span></div></div><div class="panel"><div class="f"><span>Type</span><i>Peak</i></div><div class="f"><span>Frequency</span><i>400 Hz G4</i></div><div class="f"><span>Bandwidth</span><i>1.0 oct, Q 1.4</i></div></div></div>';}
document.getElementById('r').innerHTML=
block('4 bands: rows share the height',4,4,0,0)+
block('12 bands: rows shrink, all visible',12,12,0,0)+
block('30 bands: rows at the 18 px minimum, list scrolls',30,11,18,36);
</script>
