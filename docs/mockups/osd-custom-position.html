<!doctype html>
<html><head><meta charset="utf-8"><title>OSD custom position and screens (approved)</title>
<!-- Approved by the owner 17 Nov 2026.
  1 OSD page, Position drop-down: the 7 built-in places; Border.hrule; muted "Your places" + the user's named places (ticked = current);
    hrule; accent "Custom position…" (opens the placement window); muted "Manage places…" (the master preset manager at this group).
    Named places are presets through the existing IPresetProvider/preset store.
  2 Placement window (dialog): title "OSD position"; cards: Screen (ChipMenu, the screen being previewed); Anchor (3x3 grid of small
    squares, one accent = chosen corner/edge/centre, clickable, Left/Right/Up/Down walk it); Across (slider + typeable px); Up/Down from the
    anchor (slider + typeable px, label follows the anchor e.g. "Up from bottom"); Name (text box); foot: Cancel, OK (Button.primary).
    OK saves the named place and selects it. Offsets are in px relative to the anchor so a place survives resolution changes.
  3 While the window is open the real OSD is shown on the chosen screen with a dashed accent edge; drag it with the mouse (sliders and
    fields follow live), typing or sliding moves it live; arrow keys nudge 1 px, Shift 10 px; it snaps to the centre lines and anchor.
  4 NEW card "Show on" beside Position (ChipMenu): "All screens" (DEFAULT, fresh install and Restore defaults), "Screen with the mouse",
    then a ticked list of each screen (choose one or several). Applies to the built-in places and to custom places alike: the place
    (anchor + offsets) is applied on every chosen screen.
  5 Bug fix: the open Position drop-down must draw above the cards below it (a switch currently shows through the list). -->
<style>body{font-family:Segoe UI;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}</style></head><body>
<p>Position [Bottom center ▾ | Your places: Above taskbar clock | Custom position… | Manage places…] · Show on [All screens ▾]<br>

</body></html>
