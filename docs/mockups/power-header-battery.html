<!doctype html>
<html><head><meta charset="utf-8"><title>Power group header: battery (approved)</title>
<!-- Approved by the owner 18 Nov 2026. The Power group's header (local and the Other PCs mirror): NO master switch; at the header's right a
  small muted fact: icon + percentage. Plugged in and full = plug glyph; plugged in and charging = charging-battery glyph (good/green);
  on battery = battery glyph showing the level (steps); low (threshold in Timing/settings, e.g. 20 %) = caution colour for glyph and words.
  No battery (desktop) = nothing shown. Tooltip: "Plugged in · charging" / "Plugged in" / "On battery · about 2 h left" (time when Windows knows).
  Glyphs from the icon library (IconGlyph), colours from theme brushes; data from the existing power/battery state on the master entry,
  sent to other PCs as part of the shared state (adds plugged/charging/time-left if missing). -->
<style>body{font-family:Segoe UI;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}</style></head><body>
<p>▼ ⏻ Power ........ 🔌 100 % | 🔋⚡ 64 % (green) | 🔋 64 % | <span style="color:#ef9f27">🔋 12 %</span></p>
</body></html>
