<!doctype html>
<html><head><meta charset="utf-8"><title>Device state refresh (approved)</title>
<!-- Approved by the owner 16 Nov 2026. Ready view header: after the "on · read HH:mm" tag, a Button.pill with a refresh glyph "Check now" reads the real state
     (Scripts: the profile's State command; Simulation: wakes the emulator hidden and reads the taught state), updates the tag, the list switch and the
     icon's lit state; while running the tag reads "checking…" and the pill is disabled. Right side: chip "Auto-check: <choice> ▾" (ChipMenu/listmenu):
     Off | When page opens | Every 5 min | Every 15 min. Defaults: Scripts = When page opens; Simulation = Off (periodic checks keep the emulator running).
     Intervals defined once (Timing.cs); choice saved per device. A failed read shows one plain line with Copy details. Nothing clips at minimum width. -->
<style>body{font-family:Segoe UI,sans-serif;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}.t{font-size:11px;border:1px solid #4a4;color:#6c6;border-radius:8px;padding:0 6px}.p{border:1px solid #666;border-radius:11px;padding:1px 9px;font-size:12px}</style></head><body>
<div style="display:flex;gap:6px;align-items:center;border:1px solid #444;border-radius:12px;padding:10px;max-width:560px"><span class="t">ready</span><span class="t">on · read 15:50</span><span class="p">⟳ Check now</span><span class="p" style="margin-left:auto">Auto-check: when page opens ▾</span></div>
</body></html>
