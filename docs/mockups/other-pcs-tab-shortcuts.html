<!doctype html>
<html><head><meta charset="utf-8"><title>Other PCs tab shortcuts and close confirm (approved)</title>
<!-- Approved by the owner 18 Nov 2026.
  1 Ctrl+T = the "+" (opens a New PC tab), Ctrl+W = the open tab's x (close). Work while the Other PCs page is open. Registered as
    bindable HotkeyActions (page-scoped, defaults Ctrl+T / Ctrl+W), shown in Actions and hotkeys.
  2 Closing an UNFINISHED New PC tab (something chosen or typed) asks via the shared confirm (DialogService.AskAsync):
    title "Close this unfinished set-up?", text "What you chose and typed here will be lost.", buttons right-aligned:
    "Cancel  Esc" (plain), "No" (N underlined), "Yes, close" (danger, Y underlined). An empty New PC tab closes without asking.
  3 Closing a LINKED PC's tab = unpair, asks: "Unpair <name>?", "Its tab closes and the two PCs stop controlling each other.
    Pair again to undo.", buttons "Cancel  Esc", "No", "Yes, unpair" (danger).
  4 Keys: Y = yes, N = no, Esc = cancel, as access keys of the shared dialog (letters underlined), so every Yes/No/Cancel dialog
    in the app gets them (extend the shared DialogMessage/dialog once). -->
<style>body{font-family:Segoe UI;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}</style></head><body>
<p>Close this unfinished set-up? · What you chose and typed here will be lost. · [Cancel Esc] [<u>N</u>o] [<u>Y</u>es, close]<br>
Unpair Laptop? · Its tab closes and the two PCs stop controlling each other. Pair again to undo. · [Cancel Esc] [<u>N</u>o] [<u>Y</u>es, unpair]</p>
</body></html>
