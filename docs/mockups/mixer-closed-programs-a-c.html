<!doctype html>
<meta charset="utf-8">
<title>Mixer: show closed programs (A) and searchable Add program (C), approved 2026-11-14</title>
<!--
APPROVED MOCK-UP for the Volume page, Mixer tab, Outputs group (and the same switch for the Microphones group is NOT wanted: programs only).
A. A switch "Show closed" on the Outputs header line, next to the "Add program..." pill (right side; the summary text 'Master + N programs' is
   trimmed first at narrow widths).
   - OFF: only programs that are open (have an audio session) or playing are listed. Programs that are closed AND have nothing worth remembering are
     never listed in either state. Programs that are closed but remembered (they have effects, a non-default route/volume/pan/mute) are hidden.
   - ON: remembered closed programs are listed too, dimmed, with the lead word "Not open" (as today), after the open ones (current sort).
   - The switch state is a persisted app setting (new field in the existing settings class; default ON so nothing disappears for existing users).
   - A closed program row that is hidden but has effects on keeps its effects/status; opening the program shows its row again at once.
   Use the shared switch style (ToggleSwitch, small, in the group header like the Wiring tab's header tools); search must still find hidden programs (search results show them).
C. "Add program..." becomes a searchable pop-down list (FlyoutPresenter.listmenu, Button.menurow rows, a search box at the top, mouse first):
   - entries: programs recently used on this PC (from the audio sessions seen before and the app's remembered list), installed programs (Start menu shortcuts /
     App Paths registry / installed UWP apps via Core, read-only, off the UI thread, cached), each with name and a muted source word ("recently used" / "installed");
   - last entry "Browse for a program (.exe)..." (file picker, as the existing Add program does today);
   - choosing one adds a normal program row exactly as the existing Add program does (remembered, with its own effects, volume, route), even though it never played;
     the row stays until its x is pressed.
   Name matching with the shared TextMatch; the list is searchable; empty state 'No match. Browse for a program...'.
Colours/sizes are placeholders for theme brushes.
-->
<style>
body{font:13px sans-serif;background:#1e1e1e;color:#ddd;margin:16px}
.g{max-width:720px;border:1px solid #444;border-radius:12px;padding:8px 10px;background:#262626;margin-bottom:14px}
.gh{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
.row{display:flex;align-items:center;gap:10px;border:1px solid #3a3a3a;border-radius:10px;padding:6px 8px;margin:0 0 5px}
.row.dim{opacity:.55}.m{color:#888}
.sw{display:inline-block;width:26px;height:14px;border-radius:8px;background:#E8873A;position:relative;vertical-align:middle}.sw:after{content:"";position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff}
.pill{border:1px solid #666;border-radius:14px;padding:2px 10px}
.pop{border:1px solid #555;border-radius:10px;padding:6px;background:#2b2b2b;max-width:360px}.pop div{padding:4px 8px;border-radius:6px}.pop div:nth-child(2){background:#363636}
</style>
