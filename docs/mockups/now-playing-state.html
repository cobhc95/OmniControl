<!doctype html>
<html><head><meta charset="utf-8"><title>Now playing: play/pause shows state (approved)</title>
<!-- Approved by the owner 18 Nov 2026. Extends now-playing-two-lines.html (keep everything there).
  1 The middle media pill's glyph follows the live playback state: PAUSE glyph while playing, PLAY glyph while paused/stopped
    (shows what a click will do). Keeps its accent look. Tooltip "Pause" / "Play".
  2 A small state tag at the right of the title line: "Playing" = Border.tag.selected (accent), "Paused" = plain Border.tag (muted).
    Nothing playing = no tag.
  3 State comes from Core/Engine/Media/NowPlaying (Windows media session playback status), live; the Other PCs mirror gets it from
    the remote PC's shared state. Implemented once in the shared FactItem.Stacked/Pills media card so every Now playing card gets it. -->
<style>body{font-family:Segoe UI;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}</style></head><body>
<p>♫ Tempest / Countless Skies · Spotify <b style="color:#e8892f">[Playing]</b><br>[⏮] [⏸] [⏭]</p>
<p>♫ Tempest / Countless Skies · Spotify <span style="color:#999">[Paused]</span><br>[⏮] [▶] [⏭]</p>
</body></html>
