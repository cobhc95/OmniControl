<!doctype html>
<html><head><meta charset="utf-8"><title>Method menu with briefs (approved)</title>
<!-- Approved by the owner 16 Nov 2026. Smart Devices "Method: ..." chip menu (MenuRowList / listmenu). Muted title "Method".
     Each row: tick + name, 2 small tags (Border.tag; .good / .caution), then one muted sentence. Text is a FIELD on the master method list (DeviceMethods), not in the view.
     Scripts: tags "light"(good), "home Wi-Fi only"(plain); "Fast, exact on/off. Tapo and Kasa."
     Simulation: tags "2–3 GB"(caution), "works away"(good); "Any app, via the cloud. Slower; re-teach after app redesigns."
     Home Assistant: NOT shown until it is built (no unbuilt options). -->
<style>body{font-family:Segoe UI,sans-serif;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}.t{font-size:11px;border:1px solid #666;border-radius:8px;padding:0 5px}.g{border-color:#4a4;color:#6c6}.w{border-color:#a83;color:#db6}.mu{font-size:11px;color:#999}.r{padding:5px 8px}</style></head><body>
<div style="width:340px;border:1px solid #666;border-radius:8px;padding:6px;background:#262626"><div class="mu" style="padding:2px 8px">Method</div>
<div class="r" style="outline:1px solid #E8833A;border-radius:6px">✓ Scripts <span class="t g">light</span> <span class="t">home Wi-Fi only</span><div class="mu">Fast, exact on/off. Tapo and Kasa.</div></div>
<div class="r">Simulation <span class="t w">2–3 GB</span> <span class="t g">works away</span><div class="mu">Any app, via the cloud. Slower; re-teach after app redesigns.</div></div></div>
</body></html>
