<!doctype html>
<html><head><meta charset="utf-8"><title>Other PC tab header, tidied (approved, design A + I1)</title>
<!-- Approved by the owner 18 Nov 2026. Replaces the busy header row of a PC tab (PcDetail). Supersedes the tag/cog placement in
  other-pc-wake.html and wake-not-confirmed.html (their states and wording rules still apply, shown in this new form).
  Row: bold name, muted real name, then at the right:
  1 CONNECTION CHIP (Button.selector-style chip + listmenu): status dot + "Tailscale · 3 ms" / "LAN · 2 ms" (green dot/edge when connected),
    "Asleep since 09:12" / "Shut down since 08:40" / "Offline" (grey dot) when not. Menu: muted heading "Connect via", ticked route rows each with its
    live result in muted/colour words ("· 3 ms", "· not reachable"), thin line, "Check now". Replaces the separate Tailscale tag and "Connect:" picker.
  2 WAKE SPLIT BUTTON (I1): one pill in two halves, NEUTRAL grey edge and words (no state colour on the button itself):
    left half = a small coloured status dot + words while awake: green "Wake ready", yellow "Wake not set up", grey "Wake unconfirmed",
    grey "Can't wake" (tooltip gives the one-line reason). While the PC is asleep/offline and wake is possible or unconfirmed, the left half becomes the
    ACTION "Wake" with the power glyph, accent words/edge/wash (small caution triangle after it when unconfirmed); click = wake, shows "Waking…" spinner,
    then the connection chip turns green or a red "Didn't wake" note appears with its tooltip. Left half when awake is not an action (click opens set-up).
    right half = cog glyph, tooltip "Set up wake…", opens the Set up wake window.
  UPDATED (approved): while the PC is AWAKE (left half is not an action) the wake control is ONE pill, no split: status dot + state words
    + a small muted cog glyph inside at the right; clicking anywhere opens Set up wake. The split (accent "Wake" | cog) appears ONLY while
    asleep/offline and wake is possible or unconfirmed. Same for the This PC title line (always the single pill there).
  3 "⋯" pill: same rows as the tab's right-click menu (shared ListMenuFlyout): Give nickname…, Set up wake…, Import settings from <name>…, thin line, Unpair (red).
  Unpair button and the separate wake tags/cog/"Turn on" are removed from the row. This-PC title-line tag keeps its look but uses the same I1 split
  (left = dot + state words, right = cog; no Wake action for this PC). Also fix the This-PC window wording: no "Asking This PC…" /
  "Waiting for This PC…" (use "Checking…" / "Waiting for your OK…"). -->

<p>Laptop Laptop2 ............ [● Asleep since 09:12 ▾] [<span style="color:#e8892f">⏻ Wake</span> | ⚙] [⋯]</p>
</body></html>
