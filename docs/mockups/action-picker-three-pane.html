<!doctype html>
<html><head><meta charset="utf-8"><title>Action picker, three panes (approved option C)</title>
<!-- Approved by the owner 15 Nov 2026: option C for the "Choose the action" window. Colours from the app theme; sizes are guides. -->
<style>
body{font-family:Segoe UI,sans-serif;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}
.win{border:1px solid #555;border-radius:8px;background:#202020;overflow:hidden;max-width:820px}
.sr{margin:10px;border:1px solid #E8833A;border-radius:6px;padding:6px 10px;color:#999}  /* search box: focused on open, filters live across ALL sections */
.c{display:flex;min-height:300px;border-top:1px solid #333}
.nav{width:130px;border-right:1px solid #333;padding:6px 0}                              /* pane 1: sections = the app's sidebar pages (same names/icons, ListBox.nav) plus Power, Launch, Recent */
.n{padding:5px 12px}.n.on{border-left:2px solid #E8833A;color:#E8833A}
.l{width:210px;border-right:1px solid #333;padding:6px}                                 /* pane 2: actions of the section, short names (no "Section - Group - " prefixes); small group headings inside */
.g{font-size:11px;color:#999;padding:6px 8px 2px}
.it{padding:5px 8px;border-radius:5px}.it.on{outline:1px solid #E8833A;background:#2a2a2a}
.add{border:1px dashed #666;border-radius:5px;padding:4px 8px;color:#999;margin:6px 8px}  /* "+ Add program" at the end of Launch > Apps */
.set{flex:1;padding:10px}                                                               /* pane 3: the chosen action's settings, always visible, live (no Apply); empty state = one muted line */
.f{display:flex;align-items:center;gap:8px;margin:6px 0}.f span:first-child{width:100px;color:#999}
.in{flex:1;border:1px solid #666;border-radius:4px;padding:2px 6px}.pl{border:1px solid #666;border-radius:10px;padding:1px 8px}
.ft{display:flex;justify-content:flex-end;gap:6px;padding:8px 10px;border-top:1px solid #333}  /* footer: only "Use this action" (Button.usebtn); no Back */
</style></head><body>
<div class="win"><div class="sr">Search actions</div>
<div class="c">
 <div class="nav"><div class="n">Displays</div><div class="n">Volume</div><div class="n">OSD</div><div class="n">Mouse and Trackpad</div><div class="n">Gestures</div><div class="n">Automation</div><div class="n on">Power</div><div class="n">Launch</div><div class="n">Recent</div></div>
 <div class="l"><div class="g">Power</div><div class="it">Sleep</div><div class="it on">Shut down</div><div class="it">Restart</div><div class="it">Lock</div><div class="g">Power mode</div><div class="it">Balanced</div></div>
 <div class="set"><div style="font-weight:600;margin-bottom:8px">Shut down</div>
  <div class="f"><span>Countdown</span><span class="in">30 s</span></div>
  <div class="f"><span>Force close</span><span class="pl">Off</span></div>
  <div class="f"><span>Warn on screen</span><span class="pl">On</span></div>
  <div style="color:#999;margin-top:10px;font-size:12px">Never runs within 2 min of start-up.</div></div>
</div>
<div class="ft"><span class="pl" style="border-color:#E8833A;color:#E8833A">Use this action</span></div></div>
<!-- Keys: typing goes to search; Up/Down move in the action list (wrap); Left/Right switch section; Tab moves into the settings pane; Enter = Use this action; Esc closes. While searching, pane 2 shows matches from every section with their section as a small muted label. Launch > Apps: each app row's settings (Program + Browse, Arguments, Start in, remove/hide) in pane 3; "+ Add program" and "Show hidden apps" at the list foot. -->
</body></html>
