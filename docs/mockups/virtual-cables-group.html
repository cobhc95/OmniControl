<!doctype html>
<meta charset="utf-8">
<title>Virtual cables group, Wiring tab (approved 2026-11-14)</title>
<!--
APPROVED MOCK-UP: a new collapsible group 'Virtual cables  N found' at the BOTTOM of the Volume > Wiring tab (below Microphones; same group panel/header as Outputs and Microphones).
Goal: the app accepts ANY virtual cable(s) from ANY maker (VB-CABLE, VB Hi-Fi Cable, VB-CABLE A+B, Voicemeeter, Virtual Audio Cable ...), several at once.
Rows (WiringRow-like, same style as Outputs rows): [switch] cable name | tag 'Input + Output' (a usable pair: a speaker end and its microphone end of the same driver; extra inputs of the same
cable such as 'CABLE In 16ch' belong to the pair) | state tag ('Free' good / 'In use' neutral with what uses it / 'Needs a restart' caution) | right side: 'Use for: master bus' / 'Use for: Automatic' (what the planner has given it)
or 'Not used: no matching output' (muted, row dimmed, switch off).
 - The switch ALLOWS or FORBIDS OmniControl to use that cable (persisted by the cable's stable id; default allowed for recognised cables).
 - A dashed '+ This device is a cable...' chip at the end (Button.blockadd.small) opens a small pop-down/window to mark an unrecognised device pair by hand: pick one playback device and one recording device
   (ChoiceItem drop-downs), a name, Add; the pair is stored and treated as a cable; each manually added cable row has an x to remove it.
 - Under the list a one-line muted hint 'Add more cables to run more programs on cables at once.' with a link 'Get more cables' (opens the VB-Audio cable page) and, where no cable is installed, the existing
   Install VB-CABLE action.
Detection: one list of known virtual cable drivers in Core (VirtualCables.Drivers: by device name / driver), real speakers never taken, pairing by driver, extras joined to their pair, user-marked pairs added;
the planner (CableBox) gives out ONLY allowed cables. Colours below are placeholders for theme brushes.
-->

.tag{border:1px solid #555;border-radius:9px;padding:0 6px;font-size:11px;color:#aaa}.tag.g2{border-color:#3d6b2e;color:#7bbf5a;background:#233a1c}
.m{color:#888}.pill{border:1px dashed #666;border-radius:12px;padding:2px 10px;color:#aaa}
</style>
