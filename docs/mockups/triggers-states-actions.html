<html><head><meta charset="utf-8"><title>Triggers from states and actions (approved)</title>
<!-- Approved by the owner 16 Nov 2026. The Choose-the-trigger window (same three-pane picker) gains two sections:
  "When a state changes": entries from a NEW master list of states (one registry, like HotkeyRegistry): each feature registers its states once
    (id, name, group/page, kind on/off | level(min,max,unit) | choice(list), current value getter, change event, "how it's known" text).
    Examples: every Smart Device's on/off (from its last read / auto-check), master volume level, muted, default speaker, display brightness level,
    power source, active mouse layer... Right pane: on/off -> "When it [turns on] [turns off] [changes]"; level -> becomes above / below / equals [value];
    choice -> becomes [value]; shows "Now: <value> · <when read> · how it's known".
  "When an action runs": every entry of the master HotkeyRegistry, grouped by section; fires whenever that action runs from anywhere (hotkey, mouse,
    gesture, another rule). A rule never triggers itself, and a chain is cut after a small limit (Timing/limits) to stop loops.
  Rule sentence reads e.g. "When L530 bulb turns on -> do Volume up".
  AUDIT FIRST: every existing trigger must come from a master list (no hand-written lists); remove the "Only with a hotkey" filter from trigger mode
  (it belongs to actions only). Nothing hard-coded: adding a state or action anywhere makes it a trigger automatically. -->
