<!-- Approved by the owner 16 Nov 2026 ("design 1"). Tray icon: SINGLE click = flyout; DOUBLE click = open OmniControl; RIGHT click = menu.
  1 FLYOUT (300 px wide, rounded 10 px panel above the tray, theme brushes, closes on click-away/Esc): rows of sliders (icon, label, slider, value)
    — default: Brightness one row per screen, Volume with the output picker (label "Speakers ▾"); then a 4-column grid of square tiles (icon + short
    label; "on" tiles take the accent wash/edge) — default tiles: FX (effects on/off), smart devices, Night light, Screenshot area, Mic mute, Rotate;
    last tile dashed "+ Add"; foot line: link "Open OmniControl" left, "Edit" (pencil) right.
  2 EDIT MODE (pencil): rows list the elements with grip (drag to reorder) and remove cross; "+ slider (any level state)" and "+ tile (any action or
    on/off state)" open the existing picker (actions + the StateRegistry, live); tiles: drag to reorder, right-click to remove or change icon; "Done".
    Saved in a settings class (DataStore, backed up). Nothing hard-coded: sliders bind to level states, tiles to actions (run) and/or on/off states (lit).
  3 RIGHT-CLICK MENU (listmenu style): Open OmniControl, Actions and hotkeys | Screenshot area, Record area | Pause all rules, Effects off |
    App settings, Quit. Items come from the master action list by id.
  Keyboard: the flyout's sliders/tiles are reachable by Tab/arrows; Esc closes. -->
