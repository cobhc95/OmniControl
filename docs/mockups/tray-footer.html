<!doctype html>
<html><head><meta charset="utf-8"><title>Tray panel footer (approved, design B)</title>
<!-- Approved by the owner 16 Nov 2026 (design B as first drawn). The dashed "+ Add" TILE is removed from the grid (no empty row).
     Footer (under a thin top rule): LEFT two small square icon buttons, 32 px wide: Add (plus glyph, tooltip "Add a tile or slider") and Edit (pencil glyph,
     tooltip "Edit"; while editing it shows a tick glyph, tooltip "Done", accent edge). RIGHT: "Open OmniControl" button (app-window glyph + words,
     accent outline). Uses shared button styles (Button.pill / icon pill + an accent variant), sizes in App.axaml. Add opens the same picker "+ Add" did. -->
<style>body{font-family:Segoe UI;background:#1b1b1b;color:#eee;padding:20px;font-size:12px}.b{border:1px solid #555;border-radius:8px;padding:5px 9px;display:inline-block}</style></head><body>
<div style="width:300px;border-top:1px solid #3a3a3a;padding-top:8px;display:flex;gap:6px"><span class="b">+</span><span class="b">✎</span><span class="b" style="margin-left:auto;border-color:#E8833A;color:#E8833A">▢ Open OmniControl</span></div>
</body></html>
