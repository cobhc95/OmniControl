<!doctype html>
<html><head><meta charset="utf-8"><title>Smart Devices: device icons (approved)</title>
<!-- Approved by the owner 16 Nov 2026. Adds to smart-devices-setup-vs-ready.html (which stays the layout master).
     Each device has an icon (26 px rounded square) left of its name in the device list and left of the name field in the detail header.
     Lit state: when the device reads ON the square takes the icon's colour wash + coloured glyph; OFF/unknown = neutral surface + muted glyph.
     Clicking the header icon (dashed outline on hover/focus) opens a listmenu-style pop-down: muted title "Icon"; 8-per-row grid of drawn glyphs
     (bulb, plug, lamp, fan, TV, desktop, coffee, thermometer, + more as Path resources in Brushes.axaml — never emoji or a font); colour dots row
     (from Palette / theme, not literals); pill "Own image…" (PathPicker, image copied into the app's data, scaled to the square).
     Default icon comes from the device's profile/method (Tapo bulb -> bulb, plug profiles -> plug). Icon id, colour and own-image file are saved on the device record (backed up).
     The detail header in Ready shows: icon, name field (stretches), Method chip, tags "ready" and "on · HH:mm"; next row On / Off / Toggle and "Edit setup…" at the right;
     grid rows Address (field + "reserved" tag), Sign-in (email field, password field with press-and-hold eye, "saved in Windows" tag), Profile (chip, "built-in · vN" tag, "Advanced…");
     foot line: last command result + "Copy details". Everything wraps; nothing clips at the minimum window width. -->
<style>body{font-family:Segoe UI,sans-serif;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}.ic{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:#2c2c2c;margin:2px}.on{background:#4a3410;color:#EF9F27}.mu{font-size:11px;color:#999}</style></head><body>
<div><span class="ic on">💡</span> L530 bulb (on) &nbsp; <span class="ic">🔌</span> Orbit 11 (off)</div>
<div style="margin-top:10px;width:300px;border:1px solid #666;border-radius:8px;padding:8px;background:#262626"><div class="mu">Icon</div>
<div><span class="ic" style="outline:1px solid #E8833A">bulb</span><span class="ic">plug</span><span class="ic">lamp</span><span class="ic">fan</span><span class="ic">tv</span><span class="ic">pc</span><span class="ic">cup</span><span class="ic">°C</span></div>
<div class="mu" style="margin-top:6px">Colour: amber · blue · green · grey &nbsp; [Own image…]</div></div>
<p class="mu">Glyph letters/emoji above are placeholders only; build with drawn Path icons.</p>
</body></html>
