<!doctype html>
<html><head><meta charset="utf-8"><title>Suggested keys switch (approved)</title>
<!-- Approved by the owner 17 Nov 2026. Displays page, each monitor's Orientation card: at the card's right, a small stacked block:
  muted "Suggested keys" + ToggleSwitch.plain, under it keycaps (KeycapRow) "Ctrl Alt ↑ ↓ ← →". Tooltip lists: Ctrl+Alt+Up Landscape,
  Down Landscape (flipped), Left Portrait, Right Portrait (flipped) (as NVIDIA's panel). Keys act on the screen under the mouse.
  ONE shared piece: a "suggested keys" set is data on the master entries (HotkeyAction.SuggestedKeys), and a shared SuggestedKeysSwitch
  works for any family of actions; only Orientation uses it now.
  Behaviour: fresh install = ON (suggested keys set). An existing user who already has their own keys on those actions = OFF.
  Flick ON: remember the user's current keys for those actions (stored with the shortcut set), set the suggested ones.
  Flick OFF: restore the remembered keys exactly (none if none). Changing any of those actions' keys by hand turns the switch OFF
  (keeping the hand-set keys as the new "own" keys). A suggested key already used by another action is skipped and the card shows a
  Border.tag.caution "Also on: <action>". Works per shortcut set (preset). -->
<style>body{font-family:Segoe UI;background:#1b1b1b;color:#eee;padding:20px;font-size:13px}</style></head><body>
<p>Orientation ◂ [▭][▯][▭][▯] ▸ ........ Suggested keys (on) / [Ctrl][Alt][↑ ↓ ← →]</p>
</body></html>
