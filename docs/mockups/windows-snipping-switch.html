<!-- Approved by the owner 17 Nov 2026. Actions and hotkeys window, settings pane of every screenshot action (shared settings),
  directly under "Same settings for every screenshot action": a full-width switch card
  "Turn off Windows' own screenshot keys", muted note "Print Screen and Win+Shift+S stop opening Snipping Tool". OFF by default.

      a Border.tag.caution "applies after sign-out" shows on the card while that is pending.
  Off: both put back exactly as they were before (previous values remembered). Registry access lives in Core/Engine. One global app setting,
  searchable; registers a hotkey action toggling it. -->
