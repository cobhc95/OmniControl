name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore the locked packages
        shell: pwsh
        run: |
          dotnet restore tests/OmniControl.Tests --locked-mode
          if ($LASTEXITCODE) { throw 'restore failed' }

      - name: Build
        shell: pwsh
        run: |
          dotnet build OmniControl.App -c Release --no-restore --nologo
          if ($LASTEXITCODE) { throw 'build failed' }

      - name: Run the tests
        shell: pwsh
        run: |
          # The recording tests need a real graphics card, which the build machine doesn't have.
          dotnet test tests/OmniControl.Tests -c Release --no-restore --nologo --filter "Needs!=GraphicsCard"
          if ($LASTEXITCODE) { throw 'tests failed' }
