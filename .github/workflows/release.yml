name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify the tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $tagCommit = (git rev-parse "refs/tags/$tag^{commit}").Trim()
          $head = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $head) { throw "Tag $tag points at $tagCommit but HEAD is $head." }
          if ($env:GITHUB_SHA -ne $head) { throw "The pushed commit $env:GITHUB_SHA is not the checked-out HEAD $head." }
          $version = ([xml](Get-Content OmniControl.App/OmniControl.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $tag) { throw "Tag $tag does not match <Version> $version in OmniControl.App.csproj." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # windows-latest already ships Inno Setup 6; install it only when the image does not have it.
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 --no-progress -y
            if ($LASTEXITCODE) { throw 'Inno Setup install failed' }
          }

      - name: Restore the locked packages
        shell: pwsh
        run: |
          dotnet restore tests/OmniControl.Tests --locked-mode
          if ($LASTEXITCODE) { throw 'restore failed' }

      - name: Run the tests
        shell: pwsh
        run: |
          # The recording tests need a real graphics card, which the build machine doesn't have; they run on the owner's PC before an upload.
          dotnet test tests/OmniControl.Tests -c Release --nologo --filter "Needs!=GraphicsCard"
          if ($LASTEXITCODE) { throw 'tests failed' }

      - name: Build Portable, Setup, checksums and notes
        shell: pwsh
        run: ./tools/release.ps1 -BuildOnly

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            bin/release/${{ env.VERSION }}/out/OmniControl-${{ env.VERSION }}-Setup.exe
            bin/release/${{ env.VERSION }}/out/OmniControl-${{ env.VERSION }}-Portable.zip

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = "bin/release/$env:VERSION/out"
          gh release create "v$env:VERSION" `
            "$out/OmniControl-$env:VERSION-Setup.exe" `
            "$out/OmniControl-$env:VERSION-Portable.zip" `
            "$out/OmniControl-$env:VERSION-SHA256SUMS.txt" `
            --latest --title "OmniControl $env:VERSION" --notes-file "$out/notes.md" --verify-tag
          if ($LASTEXITCODE) { throw 'gh release create failed' }
